<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WHtR Calculator</title>
    <link rel="stylesheet" href="style.css">
  </head>
<body>
  <div class="container">
    <h2>Profile Setup</h2>
    <input type="text" id="name" placeholder="Your Name">
    <input type="number" id="age" placeholder="Age">
    <select id="gender">
      <option value="" disabled selected>Select Gender</option>
      <option value="male">Male</option>
      <option value="female">Female</option>
    </select>
    <input type="text" id="goal" placeholder="Your Fitness Goal">
    <button onclick="saveProfileAndRedirect()">Continue</button>
  </div>

  <script>
    function saveProfileAndRedirect() {
      const name = document.getElementById("name").value.trim();
      const age = document.getElementById("age").value;
      const gender = document.getElementById("gender").value;
      const goal = document.getElementById("goal").value.trim();

      if (!name || !age || !gender || !goal) {
        alert("Please fill all fields.");
        return;
      }

      const profile = { name, age, gender, goal };
      localStorage.setItem("userProfile", JSON.stringify(profile));
      window.location.href = "menu.html";
    }
  </script>
</body>
</html>
